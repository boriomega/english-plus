<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingo – تعلّم الإنجليزية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6ff;--card:#fff;--ink:#1f2340;--mute:#6b7194;--pri:#6c5ce7;--pri2:#00c2a8;--pri-d:#4b3fc2;--ok:#12b886;--ok-bg:#d8f6ea;--bad:#ef476f;--bad-bg:#ffe0e7;--line:#e1e5f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1c1f3d;--ink:#eef0ff;--mute:#9aa0c9;--line:#2c3060;--ok-bg:#0f3a2c;--bad-bg:#46202d}}
:root[data-theme="dark]{--bg:#12142a;--card:#1c1f3d;--ink:#eef0ff;--mute:#9aa0c9;--line:#2c3060;--ok-bg:#0f3a2c;--bad-bg:#46202d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-inline-end:auto}
.path{padding:10px 16px 40px;display:flex;flex-direction:column;gap:22px}
.unit{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:18px;padding:14px 16px;font-weight:800}
.unit small{display:block;opacity:.85;font-weight:600;margin-top:2px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:110px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.node .c{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 7px 0 var(--pri-d);transition:transform .1s}
.node:active .c{transform:translateY(5px);box-shadow:0 2px 0 var(--pri-d)}
.node.done .c{background:var(--ok);box-shadow:0 7px 0 #0b8a62}
.node.lock{opacity:.45;cursor:not-allowed}
.node.lock .c{background:var(--line);box-shadow:0 7px 0 var(--mute)}
.node b{font-size:14px}
.lesson-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{border:0;background:none;font-size:26px;color:var(--mute);cursor:pointer}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .4s}
.q{flex:1;padding:12px 18px;display:flex;flex-direction:column;gap:18px}
.q h2{margin:0;font-size:22px}
.say{display:flex;align-items:center;gap:12px;justify-content:center;padding:18px;background:var(--card);border:2px solid var(--line);border-radius:20px}
.spk{width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 5px 0 var(--pri-d)}
.word{font-size:32px;font-weight:900;direction:ltr}
.ar{font-size:30px;font-weight:900}
.opts{display:grid;gap:12px}
.opt{padding:16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);font:inherit;font-size:19px;font-weight:700;cursor:pointer;text-align:center}
.opt.en{direction:ltr}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.opt:disabled{cursor:default}
.inp{width:100%;padding:16px;font:inherit;font-size:20px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);direction:ltr;text-align:left}
.inp:focus{outline:none;border-color:var(--pri)}
.foot{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.foot.ok{background:var(--ok-bg);border-color:var(--ok)}
.foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.msg{font-weight:900;font-size:18px;margin-bottom:10px;display:none}
.foot.ok .msg{display:block;color:var(--ok)}
.foot.bad .msg{display:block;color:var(--bad)}
.msg span{display:block;font-weight:700;font-size:15px;color:var(--ink);direction:ltr;text-align:right;margin-top:3px}
.btn{width:100%;padding:15px;border:0;border-radius:16px;font:inherit;font-size:18px;font-weight:900;color:#fff;background:var(--pri);box-shadow:0 5px 0 var(--pri-d);cursor:pointer}
.btn:disabled{background:var(--line);color:var(--mute);box-shadow:none;cursor:not-allowed}
.foot.ok .btn{background:var(--ok);box-shadow:0 5px 0 #0b8a62}
.foot.bad .btn{background:var(--bad);box-shadow:0 5px 0 #b82a4c}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.end .big{font-size:84px}
.end .row{display:flex;gap:12px}
.pill{padding:10px 18px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:900}
.end .btn{max-width:320px}
.alt{background:var(--card)!important;color:var(--pri)!important;border:2px solid var(--line);box-shadow:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
var LESSONS=[
{t:"الأساسيات",i:"👋",w:[["hello","مرحبا"],["goodbye","وداعا"],["please","من فضلك"],["thank you","شكرا"],["yes","نعم"],["no","لا"]]},
{t:"العائلة",i:"👨‍👩‍👧",w:[["mother","أم"],["father","أب"],["brother","أخ"],["sister","أخت"],["son","ابن"],["daughter","ابنة"]]},
{t:"الطعام",i:"🍎",w:[["water","ماء"],["bread","خبز"],["apple","تفاحة"],["milk","حليب"],["rice","أرز"],["egg","بيضة"]]},
{t:"الألوان",i:"🎨",w:[["red","أحمر"],["blue","أزرق"],["green","أخضر"],["yellow","أصفر"],["black","أسود"],["white","أبيض"]]},
{t:"الحيوانات",i:"🦁",w:[["cat","قطة"],["dog","كلب"],["bird","طائر"],["fish","سمكة"],["horse","حصان"],["lion","أسد"]]}
];
var S={xp:0,streak:0,hearts:5,done:0};
try{var s=JSON.parse(localStorage.getItem("lingo")||"null");if(s)S=s}catch(e){}
function save(){try{localStorage.setItem("lingo",JSON.stringify(S))}catch(e){}}
var app=document.getElementById("app");
var AC=null;
function ctx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,type,vol){var a=ctx();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.25,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
function good(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.09,.25,"triangle",.28)})}
function bad(){tone(220,0,.18,"sawtooth",.18);tone(165,.15,.28,"sawtooth",.18)}
function win(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,i*.12,.3,"triangle",.28)})}
function speak(w){try{if(!("speechSynthesis"in window))return;var u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){var h='<div class="top"><div class="logo">Lingo</div><div class="stat">🔥 '+S.streak+'</div><div class="stat">⭐ '+S.xp+'</div><div class="stat">❤️ '+S.hearts+'</div></div><div class="path"><div class="unit">الوحدة 1<small>كلمات إنجليزية يومية</small></div>';var off=[0,40,70,40,0];LESSONS.forEach(function(L,i){var cls=i<S.done?"done":(i===S.done?"":"lock");h+='<div style="display:flex;justify-content:center"><button class="node '+cls+'" style="transform:translateX('+(i%2?-1:1)*off[i%5]+'px)" onclick="'+(cls==="lock"?"":"start("+i+")")+'"><span class="c">'+(cls==="done"?"✅":(cls==="lock"?"🔒":L.i))+'</span><b>'+L.t+'</b></button></div>'});h+='</div>';app.innerHTML=h}
var Q,k,L,ci,sel,checked,correctN,mistakes;
function start(i){ctx();if(S.hearts<1)S.hearts=5;L=i;var ws=shuffle(LESSONS[i].w);Q=ws.map(function(w,n){return{type:["hear","see","type"][n%3],en:w[0],ar:w[1]}});k=0;correctN=0;mistakes=0;show()}
function opts(q,field){var pool=LESSONS.reduce(function(a,l){return a.concat(l.w)},[]).filter(function(w){return w[0]!==q.en});var idx=field===0?0:1;var d=shuffle(pool).slice(0,3).map(function(w){return w[idx]});return shuffle(d.concat([idx===0?q.en:q.ar]))}
function show(){if(k>=Q.length)return finish();var q=Q[k];sel=null;checked=false;var pct=Math.round(correctN/6*100);var h='<div class="lesson-top"><button class="x" onclick="home()">✕</button><div class="bar"><i style="width:'+pct+'%"></i></div><div class="stat">❤️ '+S.hearts+'</div></div><div class="q">';if(q.type==="hear"){h+='<h2>اضغط على السماعة واختر الكلمة الصحيحة</h2><div class="say"><button class="spk" onclick="speak(\''+q.en+'\')">🔊</button></div><div class="opts">';q.o=q.o||opts(q,0);q.o.forEach(function(o){h+='<button class="opt en" onclick="pick(this)">'+o+'</button>'});h+='</div>'}else if(q.type==="see"){h+='<h2>ما معنى هذه الكلمة؟</h2><div class="say"><button class="spk" onclick="speak(\''+q.en+'\')">🔊</button><span class="word">'+q.en+'</span></div><div class="opts">';q.o=q.o||opts(q,1);q.o.forEach(function(o){h+='<button class="opt" onclick="pick(this)">'+o+'</button>'});h+='</div>'}else{h+='<h2>اكتب الكلمة بالإنجليزية</h2><div class="say"><span class="ar">'+q.ar+'</span></div><input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in English" oninput="document.getElementById(\'go\').disabled=!this.value.trim()">'}h+='</div><div class="foot" id="foot"><div class="msg" id="msg"></div><button class="btn" id="go" disabled onclick="act()">تحقق</button></div>';app.innerHTML=h;if(q.type==="hear")setTimeout(function(){speak(q.en)},300);var i=document.getElementById("inp");if(i){i.focus();i.onkeydown=function(e){if(e.key==="Enter")act()}}}
function pick(b){if(checked)return;[].forEach.call(document.querySelectorAll(".opt"),function(o){o.classList.remove("sel")});b.classList.add("sel");sel=b.textContent;document.getElementById("go").disabled=false}
function norm(s){return s.toLowerCase().replace(/[^a-z ]/g,"").trim()}
function act(){var g=document.getElementById("go");if(g.disabled)return;if(checked){k++;return show()}var q=Q[k],ok,right;if(q.type==="type"){var v=document.getElementById("inp").value;right=q.en;ok=norm(v)===norm(q.en);document.getElementById("inp").disabled=true}else{right=q.type==="hear"?q.en:q.ar;ok=sel===right;[].forEach.call(document.querySelectorAll(".opt"),function(o){o.disabled=true;if(o.textContent===right){o.style.borderColor="var(--ok)"}else if(o.classList.contains("sel")){o.style.borderColor="var(--bad)"}})}checked=true;var f=document.getElementById("foot"),m=document.getElementById("msg");if(ok){good();correctN++;f.className="foot ok";m.innerHTML=["ممتاز! 🎉","أحسنت! ⭐","إجابة صحيحة! 💪","رائع! 🔥"][Math.floor(Math.random()*4)];S.xp+=2;speak(q.en)}else{bad();mistakes++;if(S.hearts>0)S.hearts--;f.className="foot bad";m.innerHTML='التصحيح:<span>'+(q.type==="hear"?q.en:(q.type==="see"?q.ar:q.en))+'</span>';speak(q.en);Q.push({type:q.type,en:q.en,ar:q.ar})}save();g.textContent="متابعة"}
function finish(){win();var first=L===S.done;if(first){S.done=Math.min(S.done+1,LESSONS.length);S.streak++}S.xp+=10;save();var next=L+1<LESSONS.length;app.innerHTML='<div class="end"><div class="big">🏆</div><h1 style="margin:0">أنهيت الدرس!</h1><div class="row"><div class="pill">⭐ +'+(10+correctN*2)+' XP</div><div class="pill">❌ '+mistakes+' أخطاء</div></div>'+(next?'<button class="btn" onclick="start('+(L+1)+')">الدرس التالي ←</button>':'<p>أنهيت كل الدروس! 🎊</p>')+'<button class="btn alt" onclick="home()">الرئيسية</button></div>'}
home();
</script>
</body>
</html>
