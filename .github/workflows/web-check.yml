name: Web app validation
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check required app assets
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/manifest.webmanifest
          test -s web/service-worker.js
